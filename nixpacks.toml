[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci || npm install"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan storage:link && (php artisan migrate --force && php artisan db:seed --force || echo 'Database migration pending') && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
